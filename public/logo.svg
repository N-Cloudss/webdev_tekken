<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- New Bright Gradient for text on dark background -->
    <linearGradient id="textGradInverted" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <filter id="glowInverted" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Group for Icon (3D Printing Isometric Graphic) - All elements lightened -->
  <g transform="translate(25, 30)">
    <!-- Bottom Layer (Lightened) -->
    <!-- Surface -->
    <polygon points="50,66 90,86 50,106 10,86" fill="#bfdbfe"/>
    <!-- Left Face -->
    <polygon points="10,86 50,106 50,114 10,94" fill="#a5f3fc"/>
    <!-- Right Face -->
    <polygon points="50,106 90,86 90,94 50,114" fill="#60a5fa"/>

    <!-- Middle Layer (Lightened) -->
    <polygon points="50,38 90,58 50,78 10,58" fill="#d1fae5"/>
    <polygon points="10,58 50,78 50,86 10,66" fill="#bfdbfe"/>
    <polygon points="50,78 90,58 90,66 50,86" fill="#a5f3fc"/>

    <!-- Top Layer (Lightened) -->
    <polygon points="50,10 90,30 50,50 10,30" fill="#e0f2fe"/>
    <polygon points="10,30 50,50 50,58 10,38" fill="#d1fae5"/>
    <polygon points="50,50 90,30 90,38 50,58" fill="#bfdbfe"/>

    <!-- 3D Printer Nozzle (Medium grey for contrast, not dark) -->
    <!-- Upper Block -->
    <polygon points="38,-30 62,-30 58,-15 42,-15" fill="#cbd5e1"/>
    <!-- Lower Tip -->
    <polygon points="42,-15 58,-15 53,5 47,5" fill="#e2e8f0"/>
    <!-- Highlight/Detail (Medium grey) -->
    <rect x="46" y="-15" width="8" height="2" fill="#cbd5e1" />

    <!-- Laser / Print beam (Brighter cyan) -->
    <line x1="50" y1="5" x2="50" y2="30" stroke="#bef264" stroke-width="2.5" stroke-dasharray="4 2" />
    
    <!-- Glowing printing point (Brighter glow, white/cyan) -->
    <circle cx="50" cy="30" r="4.5" fill="#ccfbf1" filter="url(#glowInverted)"/>
    <circle cx="50" cy="30" r="1.5" fill="#ffffff" />
  </g>

  <!-- Group for Typography -->
  <g transform="translate(145, 0)">
    <!-- Main Logo Text - Switched to White/Bright Gradient -->
    <text x="0" y="95" font-family="'Montserrat', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
      <tspan fill="url(#textGradInverted)">3D</tspan>
      <tspan fill="#ffffff" dx="12">POSM</tspan>
    </text>
    
    <!-- Subtitle - Light grey for contrast -->
    <text x="4" y="125" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1" letter-spacing="2.6">
      3D PRINTING ORDER SERVICE MANAGEMENT
    </text>
    
    <!-- Graphic line accent under text - Now White/Bright Cyan -->
    <line x1="4" y1="140" x2="45" y2="140" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>